<div style="display: grid; gap: 12px">
<div class="pm-slider">
  <div class="pm-slider__head"><span class="pm-slider__label" id="volume-label">Volume</span><span class="pm-slider__value" aria-hidden="true">40%</span></div>
  <div class="pm-slider__control">
    <div class="pm-slider__track">
      <div class="pm-slider__fill" style="width: 40%"></div>
      <div class="pm-slider__thumb" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" aria-labelledby="volume-label" style="left: 40%"></div>
    </div>
  </div>
</div>
<div class="pm-slider">
  <div class="pm-slider__head"><span class="pm-slider__label" id="zoom-label">Zoom</span></div>
  <div class="pm-slider__control">
    <div class="pm-slider__track">
      <div class="pm-slider__fill" style="width: 50%"></div>
      <div class="pm-slider__thumb" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-labelledby="zoom-label" style="left: 50%"></div>
    </div>
    <div class="pm-slider__ticks pm-slider__ticks--after" aria-hidden="true"><span class="pm-slider__tick" style="left: 0%"></span><span class="pm-slider__tick" style="left: 25%"></span><span class="pm-slider__tick" style="left: 50%"></span><span class="pm-slider__tick" style="left: 75%"></span><span class="pm-slider__tick" style="left: 100%"></span></div>
  </div>
</div>
<div class="pm-slider pm-slider--disabled">
  <div class="pm-slider__head"><span class="pm-slider__label" id="balance-label">Balance</span></div>
  <div class="pm-slider__control">
    <div class="pm-slider__track">
      <div class="pm-slider__fill" style="width: 70%"></div>
      <div class="pm-slider__thumb" role="slider" tabindex="-1" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" aria-labelledby="balance-label" aria-disabled="true" style="left: 70%"></div>
    </div>
  </div>
</div>
</div>
