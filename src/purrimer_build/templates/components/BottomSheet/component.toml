name = "BottomSheet"
group = "Mobile"
order = 55
summary = "A sheet that rises from the bottom over a scrim; drag it down, tap the scrim or press Escape to close."
slint_exports = ["BottomSheet", "BottomSheetAction"]

[props.open]
type = "bool"
default = false
doc = "Whether the sheet is shown."

[props.title]
type = "string"
default = ""
doc = "Sheet title."

[props.description]
type = "string"
default = ""
doc = "A line under the title in fgColor-muted."

[props.icon]
type = "icon"
default = ""
doc = "An Octicon in a 32px tile before the title."

[props.tone]
type = "enum"
default = "accent"
doc = "Colours the icon tile."
values = ["accent", "info", "success", "attention", "danger", "neutral"]

[props.size]
type = "enum"
default = "auto"
doc = "auto fits the content; half and full set the height."
values = ["auto", "half", "full"]

[props.dismissible]
type = "bool"
default = true
doc = "Dragging, the scrim and Escape close the sheet. Off, only an action closes it."

[props.grabber]
type = "bool"
default = true
doc = "Shows the drag handle."

[props.inline]
type = "bool"
default = false
doc = "Draws the sheet in place with no scrim, for docs and previews."
