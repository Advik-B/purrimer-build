name = "Burst"
group = "Motion"
order = 109
summary = "Celebration particles from the centre of whatever it wraps: confetti when playful, drifting motes when sleepy."

[props.fire]
type = "int"
default = 0
doc = "Change it to burst (the web takes any value). Fire once per achievement: a merged pull request, a finished checklist, a milestone."

[props.variant]
type = "enum"
default = ""
doc = "confetti (the playful default), motes (the sleepy default), ring, or rain across the whole window."
values = ["", "confetti", "motes", "ring", "rain"]

[props.count]
type = "int"
default = 0
doc = "Particles; 0 uses the variant's (26 confetti, 9 motes, 10 ring, 36 rain)."

[props.spread]
type = "int"
default = 0
doc = "How far they travel, in px; 0 uses 120 playful, 56 sleepy."

[props.originX]
type = "number"
default = 0.5
doc = "Where they start across the content, 0 to 1."

[props.originY]
type = "number"
default = 0.5
doc = "Where they start down the content, 0 to 1."

[props.onMount]
type = "bool"
default = false
doc = "Also bursts when first shown."

[props.seed]
type = "int"
default = 0
doc = "A seed makes the burst repeat exactly; 0 picks a new one each time."

[props.kind]
type = "enum"
default = ""
doc = "Forces a kind; empty follows the scope. Reduced motion shows nothing in sleepy and motes in playful."
values = ["", "sleepy", "playful"]
