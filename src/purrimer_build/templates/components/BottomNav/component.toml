name = "BottomNav"
group = "Mobile"
order = 52
summary = "Three to five destinations at the bottom of the screen, marked by a bar on top that people can scrub across."
web_exports = ["type BottomNavItem"]

[props.items]
type = "list"
default = []
doc = "Three to five items: icon, label, an optional activeIcon, and a badge count or dot."

[props.selected]
type = "int"
default = 0
doc = "Index of the current destination."

[props.showLabels]
type = "bool"
default = false
doc = "Shows labels under the icons."
