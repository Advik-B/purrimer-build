name = "Snackbar"
group = "Mobile"
order = 56
summary = "A short message on an inverse surface above the bottom bar, with one optional action."

[props.open]
type = "bool"
default = false
doc = "Whether it is shown."

[props.message]
type = "string"
default = ""
doc = "One line of text."

[props.action]
type = "string"
default = ""
doc = "Action button text."

[props.duration]
type = "int"
default = 4000
doc = "Milliseconds before it closes; 0 keeps it open."
