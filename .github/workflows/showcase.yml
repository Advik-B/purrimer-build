name: Showcase

# Runs every example in examples/ on its real toolkit and screenshots it. On pull requests this is a check;
# on pushes to master the screenshots and docs/components/*.md are committed back.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: render (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: web
            targets: css,classless,svelte,solid
          - group: qtwidgets
            targets: qtwidgets
          - group: qtquick
            targets: qtquick
            display: true
          - group: avalonia
            targets: avalonia
          - group: slint
            targets: slint
            display: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Python packages
        run: uv sync --locked --group showcase

      - name: Install Node
        if: matrix.group == 'web'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/web/package-lock.json
      - name: Install web packages and Chromium
        if: matrix.group == 'web'
        working-directory: showcase/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Qt and display libraries
        if: matrix.group == 'qtwidgets' || matrix.group == 'qtquick' || matrix.group == 'slint'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libegl1 libgl1-mesa-dri libfontconfig1 \
            libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcursor1 libxi6 libxrandr2

      - name: Install .NET
        if: matrix.group == 'avalonia'
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install slint-viewer
        if: matrix.group == 'slint'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The prebuilt viewer also links the libraries of its KMS backend.
          sudo apt-get install -y --no-install-recommends libinput10 libgbm1 libdrm2 libudev1 libseat1
          gh release download v1.18.1 -R slint-ui/slint -p slint-viewer-linux.tar.gz -O - | tar xz -C "$RUNNER_TEMP"
          if ldd "$RUNNER_TEMP/slint-viewer/slint-viewer" | grep "not found"; then exit 1; fi
          echo "$RUNNER_TEMP/slint-viewer" >> "$GITHUB_PATH"

      - name: Build every target
        run: uv run scripts/showcase.py build
      - name: Run the examples
        run: >-
          ${{ matrix.display && 'xvfb-run -a -s "-screen 0 1280x1024x24"' || '' }}
          uv run scripts/showcase.py run --targets ${{ matrix.targets }}

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p shots
          for target in $(echo "${{ matrix.targets }}" | tr ',' ' '); do
            if [ -d "showcase/out/$target" ]; then cp -r "showcase/out/$target" shots/; fi
          done
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: screenshots-${{ matrix.group }}
          path: shots/
          if-no-files-found: ignore

  publish:
    needs: render
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: screenshots-*
          path: new-shots
          merge-multiple: true
      # Keeps a committed screenshot unless the new one visibly differs, so rendering noise never makes a commit.
      - name: Update the screenshots
        run: uv run --with pillow scripts/showcase.py collect new-shots
      - name: Write the docs
        run: uv run scripts/showcase.py docs
      # Pushes made with GITHUB_TOKEN do not start new workflow runs, so this cannot loop.
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs README.md
          if git diff --cached --quiet; then
            echo "Screenshots and docs are up to date."
            exit 0
          fi
          git commit -m "Update screenshots"
          git pull --rebase origin master
          git push origin HEAD:master
